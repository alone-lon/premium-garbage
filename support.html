<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7×24 在线客服</title>
<style>
:root{--paper:#FAF6EE;--ink:#1C1914;--muted:#8A8272;--seal:#BF3A2B;--faint:#DDD5C3;--bubble:#FFFFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
.page{max-width:800px;margin:0 auto;padding:60px 28px 110px}
.meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:14px;font-size:12px;letter-spacing:.18em;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.mast{padding:50px 0 36px;text-align:center}
.mast .en{font-size:11px;letter-spacing:.42em;color:var(--muted);margin-bottom:22px}
.mast h1{font-size:clamp(32px,6vw,52px);font-weight:700;letter-spacing:.12em;font-family:"Songti SC","STSong","SimSun",Georgia,serif}
.mast .sub{margin-top:18px;font-size:14px;color:var(--muted)}
.chat{border:1px solid var(--ink);background:#F6F0E2;height:430px;overflow-y:auto;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.row{display:flex}
.row.me{justify-content:flex-end}
.bubble{max-width:72%;border:1px solid var(--ink);background:var(--bubble);padding:10px 16px;font-size:14.5px;line-height:1.8}
.row.me .bubble{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.who{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-bottom:2px}
.row.me .who{text-align:right;color:var(--muted)}
.typing{font-size:12px;color:var(--muted);letter-spacing:.1em;display:none;padding:0 4px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chip{border:1px solid var(--ink);background:transparent;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:.06em;transition:background .12s,color .12s}
.chip:hover{background:var(--ink);color:var(--paper)}
.inputrow{display:flex;gap:10px;margin-top:14px}
.inputrow input{flex:1;border:1px solid var(--ink);background:#fff;padding:12px 16px;font-size:14.5px;font-family:inherit;color:var(--ink);outline:none}
.inputrow input:focus{border-color:var(--seal)}
.btn{display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:12px 26px;font-size:15px;letter-spacing:.14em;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.btn:hover{background:var(--seal);border-color:var(--seal)}
.stats{display:flex;border:1px solid var(--ink);margin-top:40px}
.s{flex:1;padding:20px 8px;text-align:center;border-left:1px solid var(--faint)}
.s:first-child{border-left:none}
.s .k{font-size:11px;letter-spacing:.18em;color:var(--muted)}
.s .v{font-family:"Songti SC","STSong","SimSun",Georgia,serif;font-size:26px;font-weight:700;margin-top:4px}
.s .v small{font-size:12px;font-weight:400;color:var(--muted)}
.rate{margin-top:40px}
.sec-tag{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.sec-tag .zh{font-family:"Songti SC","STSong","SimSun",Georgia,serif;font-size:20px;font-weight:700;letter-spacing:.14em}
.sec-tag .en{font-size:10px;letter-spacing:.3em;color:var(--muted)}
.rate .btns{display:flex;gap:14px;justify-content:center}
.rate .result{text-align:center;margin-top:14px;font-family:"Songti SC","STSong","SimSun",Georgia,serif;font-size:17px;min-height:2em;color:var(--seal)}
.end{margin-top:76px;border-top:1px solid var(--ink);padding-top:30px;text-align:center}
.end .zh{font-family:"Songti SC","STSong","SimSun",Georgia,serif;font-size:21px;letter-spacing:.1em}
.end .fine{margin-top:14px;font-size:12px;color:var(--muted);letter-spacing:.08em;line-height:2}
</style>
</head>
<body>
<div class="page">
  <div class="meta">
    <span>在线客服 <b>小在</b></span>
    <span>平均响应 <b>0.1 秒</b></span>
    <span>问题解决率 <b>0%(稳定)</b></span>
  </div>

  <div class="mast">
    <div class="en">ALWAYS&nbsp;ONLINE&nbsp;SUPPORT</div>
    <h1>7×24 在线客服</h1>
    <div class="sub">本客服全年无休,秒回消息,热情周到,业务能力仅限一个字。请放心提问。</div>
  </div>

  <div class="chat" id="chat">
    <div class="row">
      <div>
        <div class="who">客服 小在</div>
        <div class="bubble">在的。请问有什么可以帮您?(本句已是全部服务内容)</div>
      </div>
    </div>
    <div class="typing" id="typing">对方正在输入……</div>
  </div>

  <div class="chips" id="chips">
    <button class="chip" data-q="我的钱不见了">我的钱不见了</button>
    <button class="chip" data-q="系统崩了">系统崩了</button>
    <button class="chip" data-q="我要投诉">我要投诉</button>
    <button class="chip" data-q="你是机器人吗">你是机器人吗</button>
  </div>

  <div class="inputrow">
    <input id="input" type="text" placeholder="输入任何问题,客服随时待命" autocomplete="off">
    <button class="btn" id="sendBtn">发 送</button>
  </div>

  <div class="stats">
    <div class="s"><div class="k">本日接待</div><div class="v">1<small> 人(就是你)</small></div></div>
    <div class="s"><div class="k">问题解决</div><div class="v">0<small> 个</small></div></div>
    <div class="s"><div class="k">「在的」发送</div><div class="v"><span id="zaicount">1</span><small> 次</small></div></div>
  </div>

  <div class="rate">
    <div class="sec-tag"><span class="zh">服务评价</span><span class="en">FEEDBACK</span></div>
    <div class="btns">
      <button class="btn" id="goodBtn">解决了,好评</button>
      <button class="btn" id="badBtn">没解决,差评</button>
    </div>
    <div class="result" id="rateOut"></div>
  </div>

  <div class="end">
    <div class="zh">在的。</div>
    <div class="fine">
      本客服拥有业界最快的响应速度与最空的响应内容<br>
      精品垃圾系列 · 服务宣言:永远在线,永远在的
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var chat=$("chat"),typing=$("typing"),input=$("input");
  var zaiN=1,turns=0;

  var replies=[
    "在的。",
    "在的在的。",
    "在的,请讲。",
    "在的呢,亲。",
    "收到,在的。",
    "在的(已加急)。",
    "在的。您的情绪我已收到。",
    "在的。建议您把问题也换成「在的」,这样解决得更快。",
    "在的。解决进度:在的。",
    "在的。恭喜触发隐藏结局:本客服会说的一切,确实只有「在的」。",
    "在的。(词库已耗尽,仍在的)"
  ];
  var chipReplies={
    "我的钱不见了":"在的。",
    "系统崩了":"在的,亲。",
    "我要投诉":"在的。已记录,投诉内容:「我要投诉」,处理结果:在的。",
    "你是机器人吗":"在的(本条由真人亲自回复,真人也是这么说的)。"
  };

  function addBubble(text,me){
    var row=document.createElement("div");
    row.className="row"+(me?" me":"");
    var wrap=document.createElement("div");
    if(me){
      var w=document.createElement("div");w.className="who";w.textContent="我";
      wrap.appendChild(w);
    }
    var b=document.createElement("div");
    b.className="bubble";b.textContent=text;
    wrap.appendChild(b);
    row.appendChild(wrap);
    chat.insertBefore(row,typing);
    chat.scrollTop=chat.scrollHeight;
  }
  function botSay(text){
    typing.style.display="block";
    chat.scrollTop=chat.scrollHeight;
    setTimeout(function(){
      typing.style.display="none";
      addBubble(text,false);
      zaiN++;
      $("zaicount").textContent=zaiN;
    },520+Math.random()*420);
  }
  function send(text){
    if(!text)return;
    turns++;
    addBubble(text,true);
    var reply=chipReplies[text]||replies[Math.min(turns,replies.length-1)];
    botSay(reply);
  }

  var chips=document.querySelectorAll(".chip");
  for(var i=0;i<chips.length;i++){
    chips[i].addEventListener("click",function(){send(this.getAttribute("data-q"))});
  }
  $("sendBtn").addEventListener("click",function(){
    send(input.value.trim());input.value="";
  });
  input.addEventListener("keydown",function(e){
    if(e.key==="Enter"){send(input.value.trim());input.value=""}
  });

  $("goodBtn").addEventListener("click",function(){
    $("rateOut").textContent="「感谢好评。您的肯定我们收到了,在的。」";
  });
  $("badBtn").addEventListener("click",function(){
    $("rateOut").textContent="「收到差评,我们深感抱歉。改进措施:在的。」";
  });
})();
</script>
</body>
</html>
